name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and target
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run tests
        run: cargo test --verbose --manifest-path rust-core/Cargo.toml

      - name: Build project
        run: cargo build --release --manifest-path rust-core/Cargo.toml

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-writer-package
          path: rust-core/target/release/ai_writer_cherrygarden_ressonance
  build-linux:
    runs-on: ubuntu-latest
    steps: 
  build-windows:
    runs-on: windows-latest
    steps: 
  build-macos:
    runs-on: macos-latest
    steps: 
  release: 
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps: 
