name: Check version and publish package

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  compare_versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@alexandrepedrosaai'

      - name: Install dependencies
        run: npm install

      - name: Compare current repo version with all published versions
        id: compare_versions
        continue-on-error: true
        run: |
          package_name=$(node -p "require('./package.json').name")
          repo_version=$(node -p "require('./package.json').version")
          echo "Repo version is: $repo_version"

          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          
          # Try to get published versions, handle 404 if package doesn't exist yet
          versions_list=$(npm view $package_name versions --json 2>/dev/null || echo "[]")
          echo "Published package versions: $versions_list"

          if [[ "$versions_list" == *"$repo_version"* ]]; then
            echo "Version $repo_version already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $repo_version not found. Proceeding to publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Publish package
        if: steps.compare_versions.outputs.should_publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
