name: Build and Test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and target
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run tests
        run: cargo test --verbose --manifest-path rust-core/Cargo.toml

      - name: Build project
        run: cargo build --release --manifest-path rust-core/Cargo.toml

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-writer-package-v0.2.0
          path: rust-core/target/release/AI-Writer-CherryGarden-Ressonance-Copilot-Meta-AI
